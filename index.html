<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Digital Clock</title>
    <link rel="stylesheet" href="css/style.css">

    
</head>

<body>

    <div class="clock-card">

        <div class="title">
            Digital Clock
        </div>

        <div class="time-wrapper">

            <div id="clock">
                00:00:00
            </div>

            <div id="ampm">
                AM
            </div>

        </div>

        <div id="date">
            Loading...
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Live Time
        </div>

    </div>

    <script src="JavaScript/mian.js"></script>

</body>
</html>
